    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica as configurações salvas antes da primeira pintura (evita piscar o tema).
      // Mantido em sincronia com src/lib/settings.js -> apply().
      try {
        var el = document.documentElement;
        var s = JSON.parse(localStorage.getItem('docfiles:settings')) || {};
        if (!s.mode) s.mode = JSON.parse(localStorage.getItem('docfiles:theme')) || 'system';
        for (var k in s) el.dataset[k] = String(s[k]);
        if (s.theme === 'cyber' || s.mode === 'dark' || (s.mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          el.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
